# Alembic configuration for AegisAI
# Do not edit the generated sections — use `alembic` CLI to manage migrations.

[alembic]
# Path to migration scripts (relative to this file's location)
script_location = alembic

# Template for generated migration filenames
file_template = %%(rev)s_%%(slug)s

# Timezone for timestamps in migration files
timezone = UTC

# Database connection — read from the application environment variable.
# Never put credentials directly in this file.
sqlalchemy.url = %(DATABASE_URL)s

[post_write_hooks]
# Uncomment to auto-format generated migration files with ruff
# hooks = ruff
# ruff.type = console_scripts
# ruff.entrypoint = ruff

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
